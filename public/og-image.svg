<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#fcf9f3"/>
  <!-- Warm gradient overlay -->
  <radialGradient id="g1" cx="20%" cy="20%" r="70%">
    <stop offset="0%" stop-color="#ffdad4" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#fcf9f3" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="g2" cx="80%" cy="80%" r="60%">
    <stop offset="0%" stop-color="#fbddcd" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#fcf9f3" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect width="1200" height="630" fill="url(#g2)"/>

  <!-- Card mockup -->
  <rect x="420" y="90" width="360" height="450" rx="28" fill="white" opacity="0.9"/>
  <rect x="420" y="90" width="360" height="450" rx="28" fill="none" stroke="#8f3425" stroke-opacity="0.15" stroke-width="1.5"/>
  <!-- Card shadow -->
  <rect x="430" y="110" width="360" height="450" rx="28" fill="#8f3425" opacity="0.05"/>

  <!-- Heart icon on card -->
  <path d="M600 260C600 260 555 232 555 204C555 190 565 180 577 180C585 180 593 184 600 192C607 184 615 180 623 180C635 180 645 190 645 204C645 232 600 260 600 260Z" fill="#8f3425" opacity="0.25"/>

  <!-- Card label -->
  <text x="600" y="310" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#7e544b" letter-spacing="2" opacity="0.7">CINTA &amp; KEINTIMAN</text>

  <!-- Card question placeholder lines -->
  <rect x="490" y="330" width="220" height="10" rx="5" fill="#1c1c18" opacity="0.12"/>
  <rect x="510" y="350" width="180" height="10" rx="5" fill="#1c1c18" opacity="0.09"/>
  <rect x="530" y="370" width="140" height="10" rx="5" fill="#1c1c18" opacity="0.06"/>

  <!-- Wordmark -->
  <text x="600" y="72" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#8f3425" letter-spacing="-1">CeritaKita</text>

  <!-- Tagline -->
  <text x="600" y="590" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="400" fill="#56423e" opacity="0.7">Cerita kita, lebih dalam.</text>
</svg>
